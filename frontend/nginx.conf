server {
  listen 3000;
  root /usr/share/nginx/html;

  # File có hash trong tên (assets/*) thì cache lâu, index.html thì luôn lấy mới
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: mọi đường dẫn không phải file thật đều trả index.html để router phía trình duyệt xử lý
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
